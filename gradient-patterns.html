<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gradient Pattern Studio</title>
<style>
  :root{
    --bg:#121316; --panel:#1a1c20; --panel2:#212328; --line:#2c2f36;
    --text:#e8e9ec; --muted:#93979f; --accent:#6fb7ff; --accent2:#ffb56f;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    display:flex; align-items:center; gap:10px; padding:9px 14px;
    border-bottom:1px solid var(--line); background:var(--panel); flex:0 0 auto;
  }
  header h1{font-size:14px; font-weight:600; margin:0;}
  header .sub{color:var(--muted); font-size:12px;}
  header .spacer{flex:1;}
  button.btn{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    padding:6px 11px; border-radius:6px; cursor:pointer; font-size:12px;
  }
  button.btn:hover{border-color:var(--accent);}
  button.btn.primary{background:#22405c; border-color:#3d6d99;}
  button.btn:disabled{opacity:.38; cursor:default;}
  main{flex:1; display:flex; min-height:0;}
  #stage{
    flex:1; display:flex; align-items:center; justify-content:center;
    background:#0c0d0f; position:relative; overflow:hidden; padding:22px;
  }
  #out{max-width:100%; max-height:100%; box-shadow:0 14px 44px rgba(0,0,0,.55);}
  #emptyHint{
    position:absolute; pointer-events:none; color:#9aa0a8; font-size:14px;
    text-align:center; line-height:1.7;
  }
  aside{
    width:352px; flex:0 0 352px; background:var(--panel); border-left:1px solid var(--line);
    overflow-y:auto; padding:12px 12px 44px;
  }
  aside::-webkit-scrollbar{width:8px;}
  aside::-webkit-scrollbar-thumb{background:#33363d; border-radius:4px;}
  .group{margin-bottom:12px; border:1px solid var(--line); border-radius:8px; overflow:hidden;}
  .group > .gh{
    padding:8px 10px; background:var(--panel2); font-weight:600; font-size:11px;
    letter-spacing:.05em; text-transform:uppercase; color:var(--muted);
    display:flex; justify-content:space-between; align-items:center;
  }
  .group.acc > .gh{color:var(--accent2);}
  .group > .gb{padding:10px; display:flex; flex-direction:column; gap:9px;}
  label.field{display:flex; flex-direction:column; gap:4px; font-size:12px;}
  label.field .lv{display:flex; justify-content:space-between; color:var(--muted);}
  label.field .lv span.val{color:var(--text); font-variant-numeric:tabular-nums;}
  input[type=range]{width:100%; accent-color:var(--accent);}
  select, input[type=number]{
    background:#0f1013; border:1px solid var(--line); color:var(--text);
    border-radius:5px; padding:5px 7px; font-size:12px; width:100%;
  }
  input[type=color]{
    background:#0f1013; border:1px solid var(--line); border-radius:5px;
    padding:2px 3px; height:28px; width:100%;
  }
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:7px;}
  .row4{display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:5px;}
  .num{display:flex; flex-direction:column; gap:3px;}
  .num span{font-size:10px; color:var(--muted); text-align:center;}
  .chk{display:flex; align-items:center; gap:7px; font-size:12px;}
  .chk input{accent-color:var(--accent);}
  .hint{color:var(--muted); font-size:11px; line-height:1.5;}
  .stopRow{display:flex; gap:5px; align-items:center;}
  .stopRow input[type=color]{flex:0 0 42px;}
  .stopRow input[type=range]{flex:1;}
  .stopRow button{
    flex:0 0 22px; height:25px; background:var(--panel2); color:var(--muted);
    border:1px solid var(--line); border-radius:5px; cursor:pointer; font-size:13px; line-height:1;
  }
  .stopRow button:hover{color:#ff8080;}
  #paletteBar,.swatch{height:20px; border-radius:5px; border:1px solid var(--line);}
  #shapeList{height:auto;}
  .note{color:var(--muted); font-size:11.5px; text-align:center; padding:7px 0;}
</style>
</head>
<body>

<header>
  <h1>Gradient Pattern Studio</h1>
  <span class="sub" id="statusLabel">empty canvas</span>
  <div class="spacer"></div>
  <button class="btn" id="btnPNG">Export PNG</button>
  <button class="btn" id="btnSVG">Export SVG</button>
</header>

<main>
  <div id="stage">
    <canvas id="out"></canvas>
    <div id="emptyHint">Empty canvas<br><span style="font-size:12px">Add a shape to begin</span></div>
  </div>

  <aside>

    <div class="group">
      <div class="gh">1 · Add shape</div>
      <div class="gb">
        <div class="row2">
          <select id="newShapeType">
            <option value="rect">Rectangle</option>
            <option value="ellipse">Circle / ellipse</option>
            <option value="semicircle">Half circle</option>
            <option value="quarter">Quarter arc</option>
            <option value="ring">Ring</option>
          </select>
          <button class="btn primary" id="btnAddShape">＋ Add</button>
        </div>
        <label class="field"><div class="lv"><span>Shapes</span><span class="val" id="shapeCountLabel">0</span></div>
          <select id="shapeList" size="3"></select>
        </label>
        <div class="row2">
          <button class="btn" id="btnDuplicate">Duplicate</button>
          <button class="btn" id="btnDeleteShape">Delete</button>
        </div>
        <div class="row2">
          <button class="btn" id="btnToFront">Bring front</button>
          <button class="btn" id="btnToBack">Send back</button>
        </div>
      </div>
    </div>

    <div id="shapePanels" style="display:none">

      <div class="group">
        <div class="gh">2 · Shape &amp; color</div>
        <div class="gb">
          <div class="row4">
            <label class="num"><span>X %</span><input type="number" id="trX" step="0.5"></label>
            <label class="num"><span>Y %</span><input type="number" id="trY" step="0.5"></label>
            <label class="num"><span>W %</span><input type="number" id="trW" step="0.5"></label>
            <label class="num"><span>H %</span><input type="number" id="trH" step="0.5"></label>
          </div>
          <label class="field"><div class="lv"><span>Rotation</span><span class="val" id="trRotV">0°</span></div>
            <input type="range" id="trRot" min="0" max="359" value="0">
          </label>
          <label class="field" id="cornerField"><div class="lv"><span>Corner radius</span><span class="val" id="trCornerV">0%</span></div>
            <input type="range" id="trCorner" min="0" max="50" value="0">
          </label>
          <label class="field" id="innerField" style="display:none"><div class="lv"><span>Ring thickness</span><span class="val" id="trInnerV">0.50</span></div>
            <input type="range" id="trInner" min="5" max="90" value="50">
          </label>
          <label class="field"><div class="lv"><span>Opacity</span><span class="val" id="trAlphaV">100%</span></div>
            <input type="range" id="trAlpha" min="5" max="100" value="100">
          </label>
          <div class="row2">
            <label class="chk"><input type="checkbox" id="snapOn" checked> Snap</label>
            <button class="btn" id="btnCenterShape">Center</button>
          </div>

          <div id="paletteBar"></div>
          <div id="stops"></div>
          <div class="row2">
            <button class="btn" id="btnAddStop">+ Stop</button>
            <button class="btn" id="btnReverse">Reverse</button>
          </div>
          <select id="palPreset">
            <option value="">— preset palettes —</option>
            <option value="grey">Grey · White</option>
            <option value="reference">Black · Red · White</option>
            <option value="mono">Black · White</option>
            <option value="ember">Black · Orange · Cream</option>
            <option value="ocean">Navy · Cyan · White</option>
            <option value="violet">Black · Violet · Pink</option>
          </select>
          <label class="chk"><input type="checkbox" id="ownPalette"> This shape has its own colors</label>
        </div>
      </div>

      <div class="group">
        <div class="gh">3 · Apply effect</div>
        <div class="gb">
          <label class="field"><div class="lv"><span>Effect</span></div>
            <select id="repMode">
              <option value="none">None — single shape</option>
              <option value="rows">Rows — bars across bands</option>
              <option value="columns">Columns — bars down bands</option>
              <option value="grid">Grid — regular tiling</option>
              <option value="mixed">Mixed — varied rows</option>
            </select>
          </label>
          <div id="repControls" style="display:none; flex-direction:column; gap:9px;">
            <div class="row2">
              <label class="field"><div class="lv"><span>Bands</span><span class="val" id="repBandsV">5</span></div>
                <input type="range" id="repBands" min="1" max="24" value="5">
              </label>
              <label class="field"><div class="lv"><span>Gap</span><span class="val" id="repGapV">1.5%</span></div>
                <input type="range" id="repGap" min="0" max="10" step="0.5" value="1.5">
              </label>
            </div>
            <label class="field" id="rowGapField"><div class="lv"><span>Row spacing</span><span class="val" id="repRowGapV">4.5%</span></div>
              <input type="range" id="repRowGap" min="0" max="30" step="0.5" value="4.5">
            </label>
            <label class="field"><div class="lv"><span>Size variation</span><span class="val" id="repVaryV">60%</span></div>
              <input type="range" id="repVary" min="0" max="100" value="60">
            </label>
            <label class="field"><div class="lv"><span>Emptiness</span><span class="val" id="repEmptyV">25%</span></div>
              <input type="range" id="repEmpty" min="0" max="80" value="25">
            </label>
            <div class="hint" id="rowFitNote" style="display:none"></div>
            <label class="chk"><input type="checkbox" id="repVaryGrad" checked> Vary gradient per copy</label>
            <div class="row2">
              <button class="btn" id="btnReroll">↻ Reroll</button>
              <span class="hint" id="instCount"></span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="group acc" id="instPanel" style="display:none">
      <div class="gh"><span id="instRole">Selected copy</span><span id="instLabel"></span></div>
      <div class="gb">
        <div class="hint" id="instRoleHint"></div>
        <div class="swatch" id="instSwatch"></div>
        <label class="field"><div class="lv"><span>Gradient type</span></div>
          <select id="gType">
            <option value="linear">Linear</option>
            <option value="radial">Radial</option>
            <option value="conic">Conic / angular</option>
          </select>
        </label>
        <label class="field" id="gAngleField"><div class="lv"><span>Angle</span><span class="val" id="gAngleV">0°</span></div>
          <input type="range" id="gAngle" min="0" max="359" value="0">
        </label>
        <div class="row2">
          <label class="field"><div class="lv"><span>From</span><span class="val" id="gT0V">0</span></div>
            <input type="range" id="gT0" min="0" max="100" value="0">
          </label>
          <label class="field"><div class="lv"><span>To</span><span class="val" id="gT1V">100</span></div>
            <input type="range" id="gT1" min="0" max="100" value="100">
          </label>
        </div>
        <label class="field"><div class="lv"><span>Midpoint</span><span class="val" id="gMidV">0.50</span></div>
          <input type="range" id="gMid" min="5" max="95" value="50">
        </label>
        <div class="row4">
          <label class="num"><span>X %</span><input type="number" id="iX" step="0.5"></label>
          <label class="num"><span>Y %</span><input type="number" id="iY" step="0.5"></label>
          <label class="num"><span>W %</span><input type="number" id="iW" step="0.5"></label>
          <label class="num"><span>H %</span><input type="number" id="iH" step="0.5"></label>
        </div>
        <div class="row2">
          <button class="btn" id="btnSwapG">Swap ends</button>
          <button class="btn" id="btnRandG">Random</button>
        </div>
        <div class="row2">
          <button class="btn" id="btnApplyAll">Apply to all</button>
          <button class="btn" id="btnDeselect">Deselect</button>
        </div>
        <button class="btn" id="btnResetToParent" style="width:100%; display:none">↺ Reset this copy to parent</button>
      </div>
    </div>

    <div class="note" id="noSelNote">Select or add a shape to edit it.</div>

    <div class="group">
      <div class="gh">Canvas</div>
      <div class="gb">
        <label class="field"><div class="lv"><span>Aspect ratio</span></div>
          <select id="aspect">
            <option value="1">Square (1:1)</option>
            <option value="1.5" selected>Landscape (3:2)</option>
            <option value="1.7778">Wide (16:9)</option>
            <option value="0.6667">Portrait (2:3)</option>
          </select>
        </label>
        <label class="field"><div class="lv"><span>Background</span></div>
          <input type="color" id="bgColor" value="#ffffff">
        </label>
        <label class="field"><div class="lv"><span>Export width</span><span class="val" id="exportWV">1600px</span></div>
          <input type="range" id="exportW" min="600" max="4000" step="100" value="1600">
        </label>
      </div>
    </div>

  </aside>
</main>

<script>
(function(){
"use strict";

/* ================= utils ================= */
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rr=v=>Math.round(v*100)/100;
function mulberry32(seed){
  let a=seed>>>0;
  return function(){
    a|=0; a=(a+0x6D2B79F5)|0;
    let t=Math.imul(a^(a>>>15),1|a);
    t=(t+Math.imul(t^(t>>>7),61|t))^t;
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
const hexToRgb=h=>{const n=parseInt(h.slice(1),16);return [(n>>16)&255,(n>>8)&255,n&255];};
const rgbToHex=c=>'#'+c.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('');

/* ================= state ================= */
const DEFAULT_PAL=[{pos:0,color:'#f4f4f4'},{pos:1,color:'#4a4a4a'}];
const state={
  aspect:1.5, exportW:1600, bg:'#ffffff', snap:true,
  palette:DEFAULT_PAL.map(s=>({...s})),
  shapes:[],
};
let selShape=-1, selInst=-1;

/* ================= palette ================= */
const palOf=s=>(s&&s.palette)?s.palette:state.palette;
const sortPal=p=>p.slice().sort((a,b)=>a.pos-b.pos);
function samplePal(pal,t){
  const p=sortPal(pal); t=clamp(t,0,1);
  if(t<=p[0].pos) return hexToRgb(p[0].color);
  if(t>=p[p.length-1].pos) return hexToRgb(p[p.length-1].color);
  for(let i=0;i<p.length-1;i++){
    const a=p[i],b=p[i+1];
    if(t>=a.pos&&t<=b.pos){
      const sp=b.pos-a.pos,k=sp<=0?0:(t-a.pos)/sp;
      const ca=hexToRgb(a.color),cb=hexToRgb(b.color);
      return [lerp(ca[0],cb[0],k),lerp(ca[1],cb[1],k),lerp(ca[2],cb[2],k)];
    }
  }
  return hexToRgb(p[p.length-1].color);
}
function gradStops(pal,g){
  const {t0,t1,mid}=g;
  if(Math.abs(mid-0.5)<0.012){
    const rev=t1<t0, lo=Math.min(t0,t1), hi=Math.max(t0,t1), span=hi-lo;
    const out=[{off:0,color:rgbToHex(samplePal(pal,lo))}];
    if(span>1e-6) sortPal(pal).forEach(p=>{
      if(p.pos>lo+1e-6&&p.pos<hi-1e-6) out.push({off:(p.pos-lo)/span,color:p.color});
    });
    out.push({off:1,color:rgbToHex(samplePal(pal,hi))});
    return rev?out.map(s=>({off:1-s.off,color:s.color})).reverse():out;
  }
  const k=Math.log(0.5)/Math.log(clamp(mid,0.03,0.97)), N=13, out=[];
  for(let i=0;i<N;i++){
    const o=i/(N-1);
    out.push({off:o,color:rgbToHex(samplePal(pal,lerp(t0,t1,Math.pow(o,k))))});
  }
  return out;
}
function sampleStops(stops,t){
  t=clamp(t,0,1);
  for(let i=0;i<stops.length-1;i++){
    const a=stops[i],b=stops[i+1];
    if(t>=a.off&&t<=b.off){
      const sp=b.off-a.off,k=sp<=0?0:(t-a.off)/sp;
      const ca=hexToRgb(a.color),cb=hexToRgb(b.color);
      return rgbToHex([lerp(ca[0],cb[0],k),lerp(ca[1],cb[1],k),lerp(ca[2],cb[2],k)]);
    }
  }
  return stops[stops.length-1].color;
}

/* ================= shapes & repetition ================= */
const KIND_LABEL={rect:'Rectangle',ellipse:'Ellipse',
  semicircle:'Half circle',quarter:'Quarter arc',ring:'Ring'};

function makeShape(kind){
  const s={
    kind, x:0.34, y:0.44, w:0.22, h:0.09,
    rot:0, corner:0, inner:0.5, alpha:1, palette:null,
    grad:{type:'linear',angle:0,t0:0,t1:1,mid:0.5},
    repeat:{mode:'none', bands:5, gap:0.015, rowGap:0.045, vary:0.6, empty:0.25,
            varyGrad:true, seed:Math.floor(Math.random()*99999999)},
    instances:[]
  };
  rebuild(s);
  return s;
}

// Vary one copy's gradient so a repeated motif doesn't look stamped.
function variedGrad(base,rng,R){
  const g={...base};
  if(!R.varyGrad) return g;
  const r=rng();
  if(r<0.42){ const t=g.t0; g.t0=g.t1; g.t1=t; }          // flip direction
  else if(r<0.62){ g.angle=(g.angle+180)%360; }
  if(rng()<0.30){
    const a=rng()*0.5, w=0.35+rng()*0.6;
    g.t0=clamp(a,0,1); g.t1=clamp(a+w,0,1);
  }
  return g;
}

// How many rows the last build actually drew vs how many were asked for,
// so the UI can say when the count is capped by the shape height.
let lastRowFit={shown:0,asked:0};

/* The heart of the effect: repeat the shape across the canvas. */
function buildInstances(s){
  const R=s.repeat;
  if(R.mode==='none') return [{x:s.x,y:s.y,w:s.w,h:s.h,grad:{...s.grad}}];
  const rng=mulberry32(R.seed);
  const out=[];
  const gap=R.gap;
  const varyOf=base=>base*(1-R.vary*0.5+rng()*R.vary);

  if(R.mode==='rows'||R.mode==='mixed'){
    // Rows stack at their ACTUAL height plus spacing, then the block is
    // centred. Both are clamped so rows can never run off the canvas:
    // the gap tightens first, and the row count caps at what fits.
    const h=s.h;
    const nMax=Math.max(1,Math.floor(1/h));
    const n=Math.min(R.bands,nMax);
    lastRowFit={shown:n, asked:R.bands};
    const rowGap = n>1 ? clamp((1-n*h)/(n-1), 0, R.rowGap) : 0;
    const total=n*h+(n-1)*rowGap;
    const y0=(1-total)/2;
    for(let i=0;i<n;i++){
      const yy=y0+i*(h+rowGap);
      let x=gap;
      // 'mixed' also varies where each row starts, for a looser rhythm
      if(R.mode==='mixed' && rng()<0.5) x+=rng()*0.12;
      let guard=0;
      while(x<1-gap-0.015 && guard++<80){
        const w=clamp(varyOf(s.w),0.015,1-gap-x);
        if(rng()>=R.empty) out.push({x,y:yy,w,h,grad:variedGrad(s.grad,rng,R)});
        x+=w+gap;
      }
    }
    return out;
  }
  if(R.mode==='columns'){
    const n=R.bands;
    const bandW=(1-gap*(n+1))/n;
    for(let i=0;i<n;i++){
      const x=gap+i*(bandW+gap);
      // mirror of the rows fix: width comes from the parent shape
      const w=Math.min(s.w,bandW);
      const xx=x+(bandW-w)/2;
      let y=gap, guard=0;
      while(y<1-gap-0.015 && guard++<80){
        const h=clamp(varyOf(s.h),0.015,1-gap-y);
        if(rng()>=R.empty) out.push({x:xx,y,w,h,grad:variedGrad(s.grad,rng,R)});
        y+=h+gap;
      }
    }
    return out;
  }
  // grid
  const cols=Math.max(1,Math.round(1/(s.w+gap)));
  const rows=Math.min(R.bands, Math.max(1,Math.floor(1/s.h)));
  lastRowFit={shown:rows, asked:R.bands};
  const cw=(1-gap*(cols+1))/cols, ch=(1-gap*(rows+1))/rows;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    if(rng()<R.empty) continue;
    // Size variation insets each cell's block rather than breaking the
    // lattice, so the control is live in grid mode too.
    const w=clamp(varyOf(cw),cw*0.12,cw);
    const h=clamp(varyOf(Math.min(s.h,ch)),ch*0.08,ch);
    out.push({x:gap+c*(cw+gap)+(cw-w)/2, y:gap+r*(ch+gap)+(ch-h)/2, w, h,
              grad:variedGrad(s.grad,rng,R)});
  }
  return out;
}

/* Rebuild copies from the parent, PRESERVING any copy the user has
 * individually overridden. Index-keyed so a child keeps its edits while
 * everything else re-derives from the parent. */
function rebuild(s){
  const old=s.instances||[];
  const next=buildInstances(s);
  // Overrides are keyed by index, which only stays meaningful while the
  // layout keeps the same shape. If the copy count changes the indices
  // refer to different copies, so drop them rather than misapply them.
  const keep = old.length===next.length;
  next.forEach((n,idx)=>{
    const o=keep?old[idx]:null;
    n.ovr = (o&&o.ovr) ? {...o.ovr} : {};
    if(!o||!o.ovr) return;
    if(o.ovr.w) n.w=o.w;
    if(o.ovr.h) n.h=o.h;
    if(o.ovr.x) n.x=o.x;
    if(o.ovr.y) n.y=o.y;
    if(o.ovr.grad) n.grad=JSON.parse(JSON.stringify(o.grad));
  });
  s.instances=next;
  if(selInst>=s.instances.length) selInst=-1;
}

/* ================= geometry ================= */
function instBox(inst,W,H){ return {x:inst.x*W,y:inst.y*H,w:inst.w*W,h:inst.h*H}; }

function shapePath(c,kind,b,opt){
  const cx=b.x+b.w/2, cy=b.y+b.h/2;
  c.beginPath();
  c.save(); c.translate(cx,cy); c.rotate(opt.rot); c.translate(-cx,-cy);
  switch(kind){
    case 'rect': {
      const rad=Math.min(b.w,b.h)/2*opt.corner*2;
      if(rad<0.5){ c.rect(b.x,b.y,b.w,b.h); }
      else{
        c.moveTo(b.x+rad,b.y);
        c.arcTo(b.x+b.w,b.y,b.x+b.w,b.y+b.h,rad);
        c.arcTo(b.x+b.w,b.y+b.h,b.x,b.y+b.h,rad);
        c.arcTo(b.x,b.y+b.h,b.x,b.y,rad);
        c.arcTo(b.x,b.y,b.x+b.w,b.y,rad);
        c.closePath();
      }
      break;
    }
    case 'ellipse': c.ellipse(cx,cy,b.w/2,b.h/2,0,0,Math.PI*2); break;
    case 'semicircle': c.ellipse(cx,b.y+b.h,b.w/2,b.h,0,Math.PI,0); c.closePath(); break;
    case 'quarter': c.moveTo(b.x,b.y+b.h); c.ellipse(b.x,b.y+b.h,b.w,b.h,0,-Math.PI/2,0); c.closePath(); break;
    case 'ring':
      c.ellipse(cx,cy,b.w/2,b.h/2,0,0,Math.PI*2);
      c.moveTo(cx+b.w/2*opt.inner,cy);
      c.ellipse(cx,cy,b.w/2*opt.inner,b.h/2*opt.inner,0,0,Math.PI*2);
      break;
  }
  c.restore();
}
function shapeSVG(kind,b,opt){
  const cx=b.x+b.w/2, cy=b.y+b.h/2;
  const tr=opt.rot?` transform="rotate(${rr(opt.rot*180/Math.PI)} ${rr(cx)} ${rr(cy)})"`:'';
  switch(kind){
    case 'rect':
      return `<rect x="${rr(b.x)}" y="${rr(b.y)}" width="${rr(b.w)}" height="${rr(b.h)}" rx="${rr(Math.min(b.w,b.h)/2*opt.corner*2)}"${tr}`;
    case 'ellipse':
      return `<ellipse cx="${rr(cx)}" cy="${rr(cy)}" rx="${rr(b.w/2)}" ry="${rr(b.h/2)}"${tr}`;
    case 'semicircle':
      return `<path d="M ${rr(b.x)} ${rr(b.y+b.h)} A ${rr(b.w/2)} ${rr(b.h)} 0 0 1 ${rr(b.x+b.w)} ${rr(b.y+b.h)} Z"${tr}`;
    case 'quarter':
      return `<path d="M ${rr(b.x)} ${rr(b.y+b.h)} L ${rr(b.x)} ${rr(b.y)} A ${rr(b.w)} ${rr(b.h)} 0 0 1 ${rr(b.x+b.w)} ${rr(b.y+b.h)} Z"${tr}`;
    case 'ring': {
      const e=(rx,ry)=>`M ${rr(cx-rx)} ${rr(cy)} a ${rr(rx)} ${rr(ry)} 0 1 0 ${rr(rx*2)} 0 a ${rr(rx)} ${rr(ry)} 0 1 0 ${rr(-rx*2)} 0 Z`;
      // Both rules are emitted: a filled <path> honours fill-rule, but the
      // same geometry inside a <clipPath> (used for conic fills) honours
      // clip-rule — with only fill-rule the ring exported as a solid disc.
      return `<path fill-rule="evenodd" clip-rule="evenodd" d="${e(b.w/2,b.h/2)} ${e(b.w/2*opt.inner,b.h/2*opt.inner)}"${tr}`;
    }
  }
  return '';
}
function gradLine(x,y,w,h,deg){
  const a=deg*Math.PI/180, dx=Math.cos(a), dy=Math.sin(a);
  const cx=x+w/2, cy=y+h/2;
  const ext=Math.abs(dx)*w/2+Math.abs(dy)*h/2;
  return {x0:cx-dx*ext,y0:cy-dy*ext,x1:cx+dx*ext,y1:cy+dy*ext};
}

/* ================= render ================= */
const canvas=document.getElementById('out'), ctx=canvas.getContext('2d');
const outputSize=()=>({W:state.exportW,H:Math.max(1,Math.round(state.exportW/state.aspect))});

function drawTo(c,W,H){
  c.fillStyle=state.bg; c.fillRect(0,0,W,H);
  state.shapes.forEach(s=>{
    const pal=palOf(s);
    c.save(); c.globalAlpha=s.alpha;
    s.instances.forEach(inst=>{
      const b=instBox(inst,W,H);
      const stops=gradStops(pal,inst.grad);
      const cx=b.x+b.w/2, cy=b.y+b.h/2;
      let g;
      if(inst.grad.type==='radial') g=c.createRadialGradient(cx,cy,0,cx,cy,Math.max(b.w,b.h)/2);
      else if(inst.grad.type==='conic') g=c.createConicGradient(inst.grad.angle*Math.PI/180,cx,cy);
      else{ const L=gradLine(b.x,b.y,b.w,b.h,inst.grad.angle); g=c.createLinearGradient(L.x0,L.y0,L.x1,L.y1); }
      stops.forEach(st=>g.addColorStop(clamp(st.off,0,1),st.color));
      c.fillStyle=g;
      shapePath(c,s.kind,b,{rot:s.rot,corner:s.corner,inner:s.inner});
      c.fill(s.kind==='ring'?'evenodd':'nonzero');
    });
    c.restore();
  });
}
function drawOverlay(c,W,H){
  const s=state.shapes[selShape];
  if(!s) return;
  c.save();
  // outline the copies only while the set is small enough to stay readable
  if(s.instances.length<=48){
    c.lineWidth=Math.max(1,W/700);
    c.setLineDash([Math.max(3,W/240),Math.max(3,W/240)]);
    c.strokeStyle='rgba(111,183,255,.32)';
    s.instances.forEach(inst=>outlineBox(c,instBox(inst,W,H),s.rot));
  }
  c.setLineDash([]);
  const inst=s.instances[selInst];
  if(inst){
    c.strokeStyle='#ffb56f'; c.lineWidth=Math.max(2,W/360);
    outlineBox(c,instBox(inst,W,H),s.rot);
  }
  c.restore();
}
// outline that follows the shape's rotation
function outlineBox(c,b,rot){
  const cx=b.x+b.w/2, cy=b.y+b.h/2;
  c.save(); c.translate(cx,cy); c.rotate(rot||0); c.translate(-cx,-cy);
  c.strokeRect(b.x,b.y,b.w,b.h);
  c.restore();
}
function render(){
  const {W,H}=outputSize();
  const scale=Math.min(1,1200/W,900/H);
  canvas.width=Math.round(W*scale); canvas.height=Math.round(H*scale);
  ctx.setTransform(scale,0,0,scale,0,0);
  drawTo(ctx,W,H);
  drawOverlay(ctx,W,H);
  ctx.setTransform(1,0,0,1,0,0);
  document.getElementById('emptyHint').style.display=state.shapes.length?'none':'';
  // kept in render() (not syncUI) so slider drags refresh it too
  const note=document.getElementById('rowFitNote');
  const sel=state.shapes[selShape];
  const capped=!!sel && sel.repeat.mode!=='none' && lastRowFit.asked>lastRowFit.shown;
  note.style.display=capped?'':'none';
  if(capped) note.textContent=
    `Showing ${lastRowFit.shown} of ${lastRowFit.asked} rows — the rest don't fit at this height. Lower H to fit more.`;
  const n=state.shapes.reduce((a,s)=>a+s.instances.length,0);
  document.getElementById('statusLabel').textContent=
    state.shapes.length?`${state.shapes.length} shape${state.shapes.length>1?'s':''} · ${n} copies`:'empty canvas';
}

/* ================= SVG ================= */
function buildSVG(){
  const {W,H}=outputSize();
  const defs=[],body=[];
  state.shapes.forEach((s,si)=>{
    const pal=palOf(s);
    const parts=[];
    s.instances.forEach((inst,ii)=>{
      const b=instBox(inst,W,H);
      const stops=gradStops(pal,inst.grad);
      const id=`g${si}_${ii}`;
      const cx=b.x+b.w/2, cy=b.y+b.h/2;
      const opt={rot:s.rot,corner:s.corner,inner:s.inner};
      if(inst.grad.type==='conic'){
        // SVG has no conic gradient — approximate with wedges, clipped
        // to this copy's own outline.
        const N=72, R=Math.hypot(b.w,b.h), st0=inst.grad.angle*Math.PI/180, w=[];
        for(let i=0;i<N;i++){
          const a0=st0+i*2*Math.PI/N, a1=st0+(i+1)*2*Math.PI/N;
          w.push(`<path d="M ${rr(cx)} ${rr(cy)} L ${rr(cx+R*Math.cos(a0))} ${rr(cy+R*Math.sin(a0))} A ${rr(R)} ${rr(R)} 0 0 1 ${rr(cx+R*Math.cos(a1))} ${rr(cy+R*Math.sin(a1))} Z" fill="${sampleStops(stops,(i+0.5)/N)}"/>`);
        }
        defs.push(`<clipPath id="c${si}_${ii}">${shapeSVG(s.kind,b,opt)}/></clipPath>`);
        parts.push(`<g clip-path="url(#c${si}_${ii})">${w.join('')}</g>`);
        return;
      }
      const ss=stops.map(x=>`<stop offset="${rr(clamp(x.off,0,1)*100)}%" stop-color="${x.color}"/>`).join('');
      if(inst.grad.type==='radial'){
        defs.push(`<radialGradient id="${id}" gradientUnits="userSpaceOnUse" cx="${rr(cx)}" cy="${rr(cy)}" r="${rr(Math.max(b.w,b.h)/2)}">${ss}</radialGradient>`);
      } else {
        const L=gradLine(b.x,b.y,b.w,b.h,inst.grad.angle);
        defs.push(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${rr(L.x0)}" y1="${rr(L.y0)}" x2="${rr(L.x1)}" y2="${rr(L.y1)}">${ss}</linearGradient>`);
      }
      parts.push(shapeSVG(s.kind,b,opt)+` fill="url(#${id})"/>`);
    });
    const op=s.alpha<0.999?` opacity="${rr(s.alpha)}"`:'';
    body.push(`<g${op}>\n${parts.join('\n')}\n</g>`);
  });
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
<rect width="${W}" height="${H}" fill="${state.bg}"/>
<defs>${defs.join('')}</defs>
${body.join('\n')}
</svg>`;
}
function download(name,blob){
  const u=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),2000);
}

/* ================= interaction ================= */
const hitCtx=document.createElement('canvas').getContext('2d');
function pick(ux,uy){
  const {W,H}=outputSize(), px=ux*W, py=uy*H;
  for(let si=state.shapes.length-1;si>=0;si--){
    const s=state.shapes[si];
    for(let ii=s.instances.length-1;ii>=0;ii--){
      const b=instBox(s.instances[ii],W,H);
      shapePath(hitCtx,s.kind,b,{rot:s.rot,corner:s.corner,inner:s.inner});
      if(hitCtx.isPointInPath(px,py,s.kind==='ring'?'evenodd':'nonzero')) return {si,ii};
    }
  }
  return null;
}
const evtUnit=e=>{
  const r=canvas.getBoundingClientRect();
  return {x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};
};
const SNAP=[0,0.25,1/3,0.5,2/3,0.75,1];
function snapVal(v,size){
  if(!state.snap) return v;
  const tol=0.012;
  for(const t of SNAP){
    if(Math.abs(v-t)<tol) return t;
    if(Math.abs(v+size-t)<tol) return t-size;
    if(Math.abs(v+size/2-t)<tol) return t-size/2;
  }
  return v;
}
let drag=null;
canvas.addEventListener('pointerdown',e=>{
  const u=evtUnit(e), p=pick(u.x,u.y);
  if(!p){ selShape=-1; selInst=-1; syncUI(); render(); return; }
  selShape=p.si; selInst=p.ii;
  const s=state.shapes[selShape];
  // dragging the single-shape case moves the shape; dragging a copy moves that copy
  const inst=s.instances[selInst];
  drag={dx:inst.x-u.x, dy:inst.y-u.y};
  try{canvas.setPointerCapture(e.pointerId);}catch(_){}
  syncUI(); render();
});
canvas.addEventListener('pointermove',e=>{
  const s=state.shapes[selShape];
  if(!drag||!s) return;
  const inst=s.instances[selInst];
  if(!inst) return;
  const u=evtUnit(e);
  inst.x=snapVal(clamp(u.x+drag.dx,-0.5,1.5),inst.w);
  inst.y=snapVal(clamp(u.y+drag.dy,-0.5,1.5),inst.h);
  if(s.repeat.mode==='none'){
    s.x=inst.x; s.y=inst.y;
  } else {
    // In repeat modes the layout owns positions, so a dragged copy must
    // record an override or the next parent edit would rebuild over it.
    markOvr(inst,'x'); markOvr(inst,'y');
  }
  syncNums(); render();
});
const endDrag=e=>{ if(!drag)return; drag=null; try{canvas.releasePointerCapture(e.pointerId);}catch(_){} };
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);

/* ================= UI ================= */
const $=id=>document.getElementById(id);
const listEl=$('shapeList'), stopsEl=$('stops'), palBar=$('paletteBar');

function syncNums(){
  const s=state.shapes[selShape]; if(!s) return;
  $('trX').value=rr(s.x*100); $('trY').value=rr(s.y*100);
  $('trW').value=rr(s.w*100); $('trH').value=rr(s.h*100);
  const inst=s.instances[selInst];
  if(inst){
    $('iX').value=rr(inst.x*100); $('iY').value=rr(inst.y*100);
    $('iW').value=rr(inst.w*100); $('iH').value=rr(inst.h*100);
  }
}
function barStyle(el,stops){
  el.style.background='linear-gradient(90deg,'+stops.map(s=>`${s.color} ${(s.pos*100).toFixed(1)}%`).join(',')+')';
}
const activePal=()=>palOf(state.shapes[selShape]);
function updateBar(){ barStyle(palBar,sortPal(activePal())); }
function buildStops(){
  const pal=activePal();
  stopsEl.innerHTML='';
  pal.forEach((stop,i)=>{
    const row=document.createElement('div'); row.className='stopRow';
    const col=document.createElement('input'); col.type='color'; col.value=stop.color;
    col.addEventListener('input',()=>{stop.color=col.value; updateBar(); render();});
    const pos=document.createElement('input');
    pos.type='range'; pos.min=0; pos.max=100; pos.value=Math.round(stop.pos*100);
    pos.addEventListener('input',()=>{stop.pos=+pos.value/100; updateBar(); render();});
    const del=document.createElement('button'); del.textContent='×';
    del.addEventListener('click',()=>{ if(pal.length<=2)return; pal.splice(i,1); buildStops(); updateBar(); render(); });
    row.append(col,pos,del); stopsEl.appendChild(row);
  });
}
function syncUI(){
  const s=state.shapes[selShape];
  $('shapePanels').style.display=s?'':'none';
  $('noSelNote').style.display=s?'none':'';
  ['btnDuplicate','btnDeleteShape','btnToFront','btnToBack'].forEach(id=>$(id).disabled=!s);
  listEl.innerHTML='';
  state.shapes.forEach((sh,i)=>{
    const o=document.createElement('option'); o.value=String(i);
    o.textContent=`${i+1}. ${KIND_LABEL[sh.kind]} · ${sh.repeat.mode}`;
    if(i===selShape)o.selected=true;
    listEl.appendChild(o);
  });
  $('shapeCountLabel').textContent=state.shapes.length;
  if(!s){ $('instPanel').style.display='none'; return; }

  syncNums();
  const set=(id,v,l)=>{ $(id).value=v; if(l!==undefined)$(id+'V').textContent=l; };
  set('trRot',Math.round(s.rot*180/Math.PI),Math.round(s.rot*180/Math.PI)+'°');
  set('trCorner',Math.round(s.corner*100),Math.round(s.corner*100)+'%');
  set('trInner',Math.round(s.inner*100),s.inner.toFixed(2));
  set('trAlpha',Math.round(s.alpha*100),Math.round(s.alpha*100)+'%');
  $('cornerField').style.display=s.kind==='rect'?'':'none';
  $('innerField').style.display=s.kind==='ring'?'':'none';
  $('snapOn').checked=state.snap;

  const R=s.repeat;
  $('repMode').value=R.mode;
  $('repControls').style.display=R.mode==='none'?'none':'flex';
  set('repBands',R.bands,R.bands);
  set('repGap',R.gap*100,(R.gap*100).toFixed(1)+'%');
  set('repRowGap',(R.rowGap||0)*100,((R.rowGap||0)*100).toFixed(1)+'%');
  $('rowGapField').style.display=(R.mode==='rows'||R.mode==='mixed')?'':'none';
  set('repVary',Math.round(R.vary*100),Math.round(R.vary*100)+'%');
  set('repEmpty',Math.round(R.empty*100),Math.round(R.empty*100)+'%');
  $('repVaryGrad').checked=R.varyGrad;
  $('instCount').textContent=`${s.instances.length} copies`;
  $('ownPalette').checked=!!s.palette;

  buildStops(); updateBar();

  const inst=s.instances[selInst];
  $('instPanel').style.display=inst?'':'none';
  if(inst){
    $('instLabel').textContent=`${selInst+1} / ${s.instances.length}`;
    const parent=selInst===0;
    const ovrKeys=Object.keys(inst.ovr||{});
    $('instRole').textContent = parent ? 'Parent copy' : 'Child copy';
    $('instRoleHint').textContent = parent
      ? 'Edits here update every child that has not been changed on its own.'
      : (ovrKeys.length
          ? 'Overrides parent: '+ovrKeys.join(', ')
          : 'Follows the parent. Editing anything here detaches just this copy.');
    $('btnResetToParent').style.display = (!parent && ovrKeys.length) ? '' : 'none';
    $('gType').value=inst.grad.type;
    set('gAngle',inst.grad.angle,inst.grad.angle+'°');
    set('gT0',Math.round(inst.grad.t0*100),Math.round(inst.grad.t0*100));
    set('gT1',Math.round(inst.grad.t1*100),Math.round(inst.grad.t1*100));
    set('gMid',Math.round(inst.grad.mid*100),inst.grad.mid.toFixed(2));
    $('gAngleField').style.display=inst.grad.type==='radial'?'none':'';
    barStyle($('instSwatch'),gradStops(palOf(s),inst.grad).map(x=>({pos:x.off,color:x.color})));
  }
}

});
const PRESETS={
  grey:[{pos:0,color:'#f4f4f4'},{pos:1,color:'#4a4a4a'}],
  reference:[{pos:0,color:'#000000'},{pos:0.42,color:'#e8472a'},{pos:1,color:'#fdf6f2'}],
  mono:[{pos:0,color:'#000000'},{pos:1,color:'#ffffff'}],
  ember:[{pos:0,color:'#0a0705'},{pos:0.45,color:'#f2801f'},{pos:1,color:'#fff2dc'}],
  ocean:[{pos:0,color:'#04143a'},{pos:0.5,color:'#20b6d6'},{pos:1,color:'#f2fbff'}],
  violet:[{pos:0,color:'#08040f'},{pos:0.45,color:'#7b3ff2'},{pos:1,color:'#ffd9f0'}],
};
$('palPreset').addEventListener('change',e=>{
  const p=PRESETS[e.target.value]; if(!p)return;
  const pal=activePal(); pal.length=0; p.forEach(s=>pal.push({...s}));
  buildStops(); updateBar(); syncUI(); render(); e.target.value='';
});
$('ownPalette').addEventListener('change',e=>{
  const s=state.shapes[selShape]; if(!s)return;
  s.palette=e.target.checked?state.palette.map(p=>({...p})):null;
  syncUI(); render();
});

/* per-copy
 * Copy 1 is the PARENT: editing it writes to the shape and re-derives every
 * child that has not been individually overridden. Any other copy is a
 * CHILD: the edit is stored on that copy and flagged in .ovr, so later
 * parent changes leave it alone. */
const isParentSel=()=>selInst===0;
function markOvr(i,key){ i.ovr=i.ovr||{}; i.ovr[key]=true; refreshOvrUI(); }
// Updates only the override hint + reset button. A full syncUI() here would
// rewrite the number field mid-typing, so the numeric handlers use this.
function refreshOvrUI(){
  const s=state.shapes[selShape]; if(!s)return;
  const i=s.instances[selInst]; if(!i)return;
  const parent=selInst===0;
  const keys=Object.keys(i.ovr||{});
  $('instRoleHint').textContent = parent
    ? 'Edits here update every child that has not been changed on its own.'
    : (keys.length ? 'Overrides parent: '+keys.join(', ')
                   : 'Follows the parent. Editing anything here detaches just this copy.');
  $('btnResetToParent').style.display = (!parent && keys.length) ? '' : 'none';
}

const instProp=(id,apply,fmt)=>$(id).addEventListener('input',e=>{
  const s=state.shapes[selShape]; if(!s)return;
  const i=s.instances[selInst]; if(!i)return;
  apply(i,+e.target.value);
  if(fmt)$(id+'V').textContent=fmt(+e.target.value);
  if(isParentSel()){
    s.grad=JSON.parse(JSON.stringify(i.grad));
    rebuild(s);
  } else {
    markOvr(i,'grad');
  }
  syncUI(); render();
});
instProp('gAngle',(i,v)=>i.grad.angle=v,v=>v+'°');
instProp('gT0',(i,v)=>i.grad.t0=v/100,v=>v);
instProp('gT1',(i,v)=>i.grad.t1=v/100,v=>v);
instProp('gMid',(i,v)=>i.grad.mid=v/100,v=>(v/100).toFixed(2));
$('gType').addEventListener('change',e=>{
  const s=state.shapes[selShape]; if(!s)return;
  const i=s.instances[selInst]; if(!i)return;
  i.grad.type=e.target.value;
  if(isParentSel()){ s.grad=JSON.parse(JSON.stringify(i.grad)); rebuild(s); }
  else markOvr(i,'grad');
  syncUI(); render();
});
const instNum=(id,apply,key)=>$(id).addEventListener('input',e=>{
  const s=state.shapes[selShape]; if(!s)return;
  const i=s.instances[selInst]; if(!i)return;
  const v=parseFloat(e.target.value); if(isNaN(v))return;
  apply(i,v/100);
  if(isParentSel() && (key==='w'||key==='h')){
    // size on the parent flows to every non-overridden child
    s[key]=i[key];
    rebuild(s);
    syncUI();
  } else {
    markOvr(i,key);
  }
  render();
});
instNum('iX',(i,v)=>i.x=v,'x'); instNum('iY',(i,v)=>i.y=v,'y');
instNum('iW',(i,v)=>i.w=Math.max(0.005,v),'w'); instNum('iH',(i,v)=>i.h=Math.max(0.005,v),'h');
const withI=fn=>()=>{
  const s=state.shapes[selShape]; if(!s)return;
  const i=s.instances[selInst]; if(!i)return;
  fn(s,i);
  if(s.repeat.mode==='none') s.grad={...i.grad};
  syncUI(); render();
};
$('btnSwapG').addEventListener('click',withI((s,i)=>{ const t=i.grad.t0; i.grad.t0=i.grad.t1; i.grad.t1=t; }));
$('btnRandG').addEventListener('click',withI((s,i)=>{
  const rng=mulberry32(Math.floor(Math.random()*1e9));
  const a=rng(), w=0.25+rng()*0.7;
  i.grad.t0=clamp(a,0,1); i.grad.t1=clamp(rng()<0.5?a+w:a-w,0,1);
  i.grad.angle=[0,90,180,270][Math.floor(rng()*4)];
}));
$('btnApplyAll').addEventListener('click',withI((s,i)=>{
  s.grad={...i.grad};
  s.instances.forEach(o=>{ if(o!==i) o.grad=JSON.parse(JSON.stringify(i.grad)); });
}));
$('btnDeselect').addEventListener('click',()=>{ selInst=-1; syncUI(); render(); });
$('btnResetToParent').addEventListener('click',()=>{
  const s=state.shapes[selShape]; if(!s)return;
  const i=s.instances[selInst]; if(!i)return;
  i.ovr={};                 // drop overrides, then re-derive from the parent
  rebuild(s);
  syncUI(); render();
});

/* canvas + export */
$('aspect').addEventListener('change',e=>{state.aspect=+e.target.value; render();});
$('bgColor').addEventListener('input',e=>{state.bg=e.target.value; render();});
$('exportW').addEventListener('input',e=>{state.exportW=+e.target.value; $('exportWV').textContent=e.target.value+'px'; render();});
$('btnPNG').addEventListener('click',()=>{
  const {W,H}=outputSize();
  const c=document.createElement('canvas'); c.width=W; c.height=H;
  drawTo(c.getContext('2d'),W,H);
  c.toBlob(b=>download('gradient-pattern.png',b),'image/png');
});
$('btnSVG').addEventListener('click',()=>download('gradient-pattern.svg',new Blob([buildSVG()],{type:'image/svg+xml'})));

syncUI(); render();
})();
</script>
</body>
</html>
