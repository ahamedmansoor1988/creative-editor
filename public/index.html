<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- top-left menus -->
<div id="menubar" class="floating">
  <div class="menu" data-menu="file">File
    <div class="dropdown">
      <button data-cmd="new">New Page…</button>
      <button data-cmd="exportPng">Export PNG</button>
    </div>
  </div>
  <div class="menu" data-menu="edit">Edit
    <div class="dropdown">
      <button data-cmd="undo">Undo <span>⌘Z</span></button>
      <button data-cmd="redo">Redo <span>⇧⌘Z</span></button>
      <button data-cmd="historyLimit">History depth…</button>
      <button data-cmd="clearHistory">Clear history</button>
      <button data-cmd="duplicate">Duplicate <span>⌘D</span></button>
      <button data-cmd="delete">Delete <span>⌫</span></button>
      <button data-cmd="selectAll">Select All <span>⌘A</span></button>
      <button data-cmd="deselect">Deselect <span>Esc</span></button>
      <button data-cmd="invertSel">Invert Selection <span>⇧⌘I</span></button>
      <button data-cmd="sameFill">Select Same Fill</button>
      <button data-cmd="sameEffects">Select Same Effects</button>
      <button data-cmd="sameSize">Select Same Size</button>
      <button data-cmd="cropSel">Crop Page to Selection</button>
      <button data-cmd="group">Group <span>⌘G</span></button>
      <button data-cmd="ungroup">Ungroup <span>⇧⌘G</span></button>
      <button data-cmd="frame">Wrap in Frame <span>⌥⌘F</span></button>
      <button data-cmd="boolUnion">Union</button>
      <button data-cmd="boolSubtract">Subtract</button>
      <button data-cmd="boolIntersect">Intersect</button>
      <button data-cmd="boolExclude">Exclude</button>
      <button data-cmd="boolFlatten">Flatten Boolean</button>
      <button data-cmd="boolRelease">Release Boolean</button>
      <button data-cmd="compound">Make Compound Path</button>
      <button data-cmd="releaseCompound">Release Compound Path</button>
      <button data-cmd="distH">Distribute Centers ⇢</button>
      <button data-cmd="distV">Distribute Centers ⇣</button>
      <button data-cmd="distHGap">Distribute Gaps ⇢</button>
      <button data-cmd="distVGap">Distribute Gaps ⇣</button>
      <button data-cmd="distExact">Distribute Exact Spacing…</button>
    </div>
  </div>
  <div class="menu" data-menu="view">View
    <div class="dropdown">
      <button data-cmd="zoomFit">Fit page <span>⌘0</span></button>
      <button data-cmd="zoomActual">100% <span>⌘1</span></button>
      <button data-cmd="zoom200">200% <span>⌘2</span></button>
      <button data-cmd="zoomSel">Fit selection <span>⇧2</span></button>
      <button data-cmd="toggleRulers">Rulers <span>⇧⌘R</span></button>
      <button data-cmd="toggleGrid">Grid <span>⌘'</span></button>
      <button data-cmd="gridSettings">Grid settings…</button>
      <button data-cmd="toggleSnap">Snapping <span>⇧⌘S</span></button>
      <button data-cmd="toggleGuides">Show guides <span>⌘;</span></button>
      <button data-cmd="addGuideV">Add vertical guide…</button>
      <button data-cmd="addGuideH">Add horizontal guide…</button>
      <button data-cmd="clearGuides">Clear guides</button>
    </div>
  </div>
  <div class="menu" data-menu="effects">Effects
    <div class="dropdown">
      <button data-fx="Pattern">Pattern</button>
      <button data-fx="Group">Group</button>
      <button data-fx="Mask">Mask</button>
      <button data-fx="Effects">Effect stack</button>
      <button data-fx="Fill">Fill</button>
      <button data-fx="Stroke">Stroke</button>
      <button data-fx="Gradient">Gradient</button>
      <button data-fx="Light">Light</button>
      <button data-fx="Prism">Prism</button>
      <button data-fx="Capsule">Capsule</button>
      <button data-fx="Strip">Strip</button>
      <button data-fx="Blob">Blob</button>
      <button data-fx="Glass">Glass</button>
      <button data-fx="Glass 2">Glass 2</button>
      <button data-fx="Shadow">Shadow</button>
      <button data-fx="Inner Shadow">Inner Shadow</button>
      <button data-fx="Glow">Glow</button>
      <button data-fx="Grain">Grain</button>
    </div>
  </div>
</div>

<!-- left: tools + pages/layers -->
<div id="leftPanel" class="floating">
  <div id="toolsRail">
    <button class="tool active" data-tool="select" data-icon="select" aria-label="Select (V)" title="Select (V)"></button>
    <button class="tool" data-tool="node" data-icon="node" aria-label="Edit nodes (A)" title="Edit nodes (A)"></button>
    <button class="tool" data-tool="pen" data-icon="pen" aria-label="Pen (P)" title="Pen (P)"></button>
    <button class="tool" data-tool="pencil" data-icon="pencil" aria-label="Pencil (N)" title="Pencil (N)"></button>
    <button class="tool" data-tool="rect" data-icon="rect" aria-label="Rectangle (R)" title="Rectangle (R)"></button>
    <button class="tool" data-tool="ellipse" data-icon="ellipse" aria-label="Ellipse (O)" title="Ellipse (O)"></button>
    <button class="tool" data-tool="polygon" data-icon="polygon" aria-label="Polygon / Star (shift P)" title="Polygon / Star (shift P)"></button>
    <button class="tool" data-tool="line" data-icon="line" aria-label="Line (L)" title="Line (L)"></button>
    <button class="tool" data-tool="text" data-icon="text" aria-label="Text (T)" title="Text (T)"></button>
    <button class="tool" data-tool="eyedrop" data-icon="eyedrop" aria-label="Eyedropper (I)" title="Eyedropper (I)"></button>
    <button class="tool" data-tool="crop" data-icon="crop" aria-label="Crop (C)" title="Crop (C)"></button>
    <button class="tool" data-tool="zoom" data-icon="zoom" aria-label="Zoom (Z)" title="Zoom (Z)"></button>
  </div>
  <div id="sidebar">
    <div class="sideHead"><span>Pages</span><button id="btnNewPage" data-icon="plus" aria-label="New page" title="New page"></button></div>
    <div id="pageList"></div>
    <div class="sideHead"><span>Layers</span></div>
    <div id="layerList"></div>
    <div class="sideHead"><span>History</span></div>
    <div id="historyList"></div>
    <div id="historyFoot"></div>
  </div>
</div>

<!-- canvas -->
<div id="stage">
  <canvas id="out"></canvas>
</div>
<div id="zoomChip" style="display:none"><input id="zoomInput" value="100%" title="Zoom — type a percentage"></div>
<div id="pencilOpts" style="display:none">
  <label>Tolerance <span id="pcTolV">2.5</span><input type="range" id="pcTol" min="0.5" max="10" step="0.1" value="2.5"></label>
  <label>Smoothing <span id="pcSmoothV">3</span><input type="range" id="pcSmooth" min="0" max="10" step="1" value="3"></label>
</div>

<!-- New Page modal -->
<div id="pageModal" style="display:none">
  <div class="modal">
    <h3>New page</h3>
    <div class="mSec">Name</div>
    <input type="text" id="npName" value="Page 1">
    <div class="mSec">Size</div>
    <div id="sizeChips">
      <button data-w="900"  data-h="600"  class="on">Landscape<br><em>900×600</em></button>
      <button data-w="1080" data-h="1080">Square<br><em>1080×1080</em></button>
      <button data-w="1600" data-h="900">Wide<br><em>1600×900</em></button>
      <button data-w="1080" data-h="1350">Portrait<br><em>1080×1350</em></button>
      <button data-w="1080" data-h="1920">Story<br><em>1080×1920</em></button>
    </div>
    <div class="row2">
      <label class="num"><span>W px</span><input type="number" id="npW" value="900" min="100" max="4000"></label>
      <label class="num"><span>H px</span><input type="number" id="npH" value="600" min="100" max="4000"></label>
    </div>
    <div class="mSec">Background</div>
    <div id="bgModeRow">
      <label><input type="radio" name="bgMode" value="solid" checked> Solid</label>
      <label><input type="radio" name="bgMode" value="gradient"> Gradient</label>
    </div>
    <div id="bgSolid">
      <input type="color" id="npBg" value="#ffffff">
      <div id="swatches">
        <button data-c="#ffffff" style="background:#ffffff"></button>
        <button data-c="#f7f3ec" style="background:#f7f3ec"></button>
        <button data-c="#0b0c0e" style="background:#0b0c0e"></button>
        <button data-c="#0a1a3a" style="background:#0a1a3a"></button>
        <button data-c="#e8472a" style="background:#e8472a"></button>
        <button data-c="#f2dc18" style="background:#f2dc18"></button>
      </div>
    </div>
    <div id="bgGrad" style="display:none">
      <div class="row2">
        <label class="num"><span>From</span><input type="color" id="npG1" value="#0a1a3a"></label>
        <label class="num"><span>To</span><input type="color" id="npG2" value="#e8472a"></label>
      </div>
      <label class="slider">Angle <span id="npAngV">90°</span>
        <input type="range" id="npAng" min="0" max="359" value="90">
      </label>
      <div class="hint">Creates an editable Background layer — refine it any time with the Fill engine.</div>
    </div>
    <div class="row2" style="margin-top:14px">
      <button class="btn" id="npCancel">Cancel</button>
      <button class="btn primary" id="npCreate">Create page</button>
    </div>
  </div>
</div>

<!-- right: inspector -->
<div id="rightPanel" class="floating">
  <div class="rp-head">Position <span class="sep">|</span> size</div>
  <div id="posSection" class="disabled">
    <div class="grid4">
      <label>X<input type="number" id="pX" step="1"></label>
      <label>Y<input type="number" id="pY" step="1"></label>
      <label>W<input type="number" id="pW" step="1"></label>
      <label>H<input type="number" id="pH" step="1"></label>
    </div>
    <div id="alignRow">
      <button data-align="left" data-icon="alignLeft" aria-label="Align left" title="Align left"></button>
      <button data-align="hcenter" data-icon="alignHCenter" aria-label="Center horizontally" title="Center horizontally"></button>
      <button data-align="right" data-icon="alignRight" aria-label="Align right" title="Align right"></button>
      <button data-align="top" data-icon="alignTop" aria-label="Align top" title="Align top"></button>
      <button data-align="vcenter" data-icon="alignVCenter" aria-label="Center vertically" title="Center vertically"></button>
      <button data-align="bottom" data-icon="alignBottom" aria-label="Align bottom" title="Align bottom"></button>
    </div>
    <label class="slider">Opacity <span id="pOpacityV">100%</span>
      <input type="range" id="pOpacity" min="5" max="100" value="100">
    </label>
    <div class="grid4" style="margin-top:6px">
      <label title="Rotation">⟳°<input type="number" id="trRot" step="1"></label>
      <label title="Scale by percent, about each centre">%<input type="number" id="trScale" placeholder="100"></label>
      <label title="Skew horizontal">⧩x<input type="number" id="trSkX" step="1"></label>
      <label title="Skew vertical">⧨y<input type="number" id="trSkY" step="1"></label>
    </div>
    <label class="slider" style="margin-top:2px">Blend mode
      <select id="objBlend">
        <option>normal</option><option>multiply</option><option>screen</option>
        <option>overlay</option><option>darken</option><option>lighten</option>
        <option>color-dodge</option><option>color-burn</option><option>hard-light</option>
        <option>soft-light</option><option>difference</option><option>exclusion</option>
        <option>hue</option><option>saturation</option><option>color</option><option>luminosity</option>
      </select></label>
    <div id="alignRow" style="margin-top:2px">
      <button id="trR90L" data-icon="rotateCcw" aria-label="Rotate 90 counter-clockwise" title="Rotate 90 counter-clockwise"></button>
      <button id="trR90R" data-icon="rotateCw" aria-label="Rotate 90 clockwise" title="Rotate 90 clockwise"></button>
      <button id="trFlipH" data-icon="flipH" aria-label="Flip horizontal" title="Flip horizontal"></button>
      <button id="trFlipV" data-icon="flipV" aria-label="Flip vertical" title="Flip vertical"></button>
    </div>
  </div>

  <hr>

  <div id="engineSection" class="disabled">
    <div id="engineSearchWrap">
      <span id="searchIcon" data-icon="search" aria-hidden="true"></span>
      <input id="engineSearch" type="text" placeholder="Search engines…" aria-label="Search engines">
      <div id="engineResults"></div>
    </div>
    <div id="fxTitleWrap">
      <button id="fxTitle" aria-haspopup="true" aria-expanded="false">Fill</button>
      <span id="fxCaret" data-icon="chevronDown" aria-hidden="true"></span>
      <div id="fxMenu" role="menu"></div>
    </div>
    <div id="fxBody"></div>
    <div id="fxPager">
      <button id="fxPrev" data-icon="chevronLeft" aria-label="Previous engine" title="Previous engine"></button>
      <button id="fxNext" data-icon="chevronRight" aria-label="Next engine" title="Next engine"></button>
    </div>
  </div>
  <div id="noSel" class="hint">Select an element to edit it.</div>
</div>

<!-- bottom: agentic bar -->
<div id="agentBar" class="floating">
  <button id="attachBtn" data-icon="image" aria-label="Attach a reference image" title="Attach one reference image (or Ctrl+V)"></button>
  <div id="attachChip" style="display:none"><img id="attachThumb" alt=""><button id="attachX" data-icon="x" data-icon-size="12" aria-label="Remove attached image" title="Remove image"></button></div>
  <input id="prompt" type="text" placeholder="Describe the creative… e.g. Generate the creative with red purple yellow color shades">
  <span id="agentStatus"></span>
  <button id="generateBtn">Generate</button>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
</div>

<script src="gradient.js"></script>
<script src="glass.js"></script>
<script src="blob.js"></script>
<script src="light.js"></script>
<script src="prism.js"></script>
<script src="capsule.js"></script>
<script src="boolean.js"></script>
<script src="snap.js"></script>
<script src="fxstack.js"></script>
<script src="history.js"></script>
<script type="module">
  /* clipper2.mjs is an ES module and the app is classic scripts, so a tiny
     shim hands it over. Module scripts are deferred, so the boolean engine
     announces itself when ready rather than being assumed present. */
  import * as C2 from './clipper2.mjs';
  if(window.BooleanEngine) window.BooleanEngine.provide(C2);
  else window.__clipper2=C2;
</script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
